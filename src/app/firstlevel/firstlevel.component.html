<h2> Course List:</h2>

<input type = "text" [ngModel] = "Course" (ngModelChange) = "modelChange($event)" />

<input type="checkbox" [ngModel] = "isChecked" (ngModelChange) = "modelChange($event)">


<!--In dropdown, nhModel always should assign with the value like here [ngModel] is assigned to "selectedvalue"-->
<select (change) = "dropvaluechange()" [ngModel] = "selectedvalue" (ngModelChange) = "modelChange($event)">
    <option  value = "1">CSharp</option>
    <option  value = "2">JavaScript</option>
    <option  value = "3">TypeScript</option>
    <option  value = "4" selected >Angular </option>
</select>
